<!DOCTYPE html>
<html>
<head>

    <link rel="icon" href="./media/ava.png">

        <main>

                <a href="./rule/index.html" class="btn-card">
                    <img src="media/preview.png" class="card-bg" alt="">

                        <img src="media/rule.svg" class="card-icon" alt="Rules">

                </a>

                <a href="#" class="btn-card">
                    <img src="media/preview.png" class="card-bg" alt="">
                    <div class="card-content">
                        <img src="media/info.svg" class="card-icon" alt="Info">
                        <span>Info / Информация</span>
                    </div>
                </a>

                <a href="#" class="btn-card">
                    <img src="media/preview.png" class="card-bg" alt="">

                        <img src="media/Court.png" class="card-icon" alt="Court">
                        <span>Court / Суд</span>
                    </div>

                <a href="#" class="btn-card">

                </a>

            <div id="reg" class="reg">

            <div id="profile" class="profile">

                    <div class="line1"> <img id="ava" src="./media/profile.svg"> <span id="name">Name Surname</span> </div>
                    <div class="line2"> <span id="username">Username -</span> </div>
                    <div class="line3"> <span id="uid">Id -</span> </div>
                    <div class="line4"> <img class="coin" title="Meow Coin" src="./media/coin.png"> <span class="balanc"> 0000 </span> </div>
